name: Push - AWS GPU

# This workflow triggers GPU tests for pushes to main/release branches.
# It replaces the old push_aws_gpu_tests.yml workflow.
# Uses reusable workflows:
#   - aws_gpu_tests.yml

on:
  push:
    # This branch never runs GPU tests. The job below is already gated on
    # `github.repository == 'newton-physics/newton'`, so on this fork it has
    # only ever SKIPPED - no runner, no AWS GPU, no cost - but it still posted
    # a run entry on every push. Ignoring the branch stops the entry as well.
    #
    # Deliberately NOT a repository-wide disable: this is a shared fork and
    # other branches keep whatever behaviour they had.
    branches-ignore:
      - "Zhaocorp/cloth-dataset-pickup"
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  run-tests:
    if: github.repository == 'newton-physics/newton'
    uses: ./.github/workflows/aws_gpu_tests.yml
    secrets: inherit
    permissions:
      id-token: write   # Required for AWS OIDC authentication in start-runner/stop-runner
      contents: read    # Required for checkout in all jobs
